<!-- Full Luxury Pre-Loader Overlay with Smooth Fade-Out -->
<div 
  *ngIf="isLoading()"
  class="fixed inset-0 z-[9999] bg-[#FAF7F2] dark:bg-[#141311] flex items-center justify-center font-sans transition-all duration-700 ease-out"
  [ngClass]="{
    'opacity-0 pointer-events-none scale-105': isFadingOut(),
    'opacity-100': !isFadingOut()
  }"
>
  <div class="ramyug-preloader-content">
    <!-- Rotating Gold Ring & Monogram Box -->
    <div class="ramyug-logo-box">
      <span class="ramyug-monogram">R</span>
      <div class="ramyug-ring"></div>
    </div>

    <!-- Brand Typography -->
    <div class="space-y-1">
      <div class="ramyug-brand-text">RAMYUG</div>
      <div class="ramyug-sub-text">ARCHITECTURAL LEGACY</div>
    </div>

    <!-- Animated Gold Progress Line -->
    <div class="ramyug-progress-bar">
      <div class="ramyug-progress-fill"></div>
    </div>
  </div>
</div>

<div class="min-h-screen flex flex-col bg-[#FAF7F2] dark:bg-[#141311] text-[#1D1C1A] dark:text-[#FAF7F2] transition-colors duration-300">
  <!-- Global Sticky Navbar -->
  <app-navbar></app-navbar>

  <!-- Router Main Content -->
  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>

  <!-- Global Luxury Footer -->
  <app-footer></app-footer>

  <!-- Floating WhatsApp Chat Concierge -->
  <app-whatsapp-button></app-whatsapp-button>
</div>
