<header
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 font-sans"
  [ngClass]="{
    'bg-[#FAF7F2]/95 dark:bg-[#141311]/95 backdrop-blur-md py-3.5 sm:py-4 shadow-subtle-luxury border-b border-[#E5DFD5] dark:border-[#2F2B26]':
      isScrolled(),
    'bg-gradient-to-b from-[#141311]/85 via-[#141311]/35 to-transparent py-4 sm:py-5':
      !isScrolled(),
  }"
>
  <div class="max-w-7xl mx-auto px-5 sm:px-6 md:px-12 flex items-center justify-between">
    <!-- Brand Emblem & Logo -->
    <a
      routerLink="/home"
      (click)="closeMobileMenu()"
      class="flex items-center gap-3 sm:gap-3.5 group focus:outline-none shrink-0"
    >
      <div
        class="w-9 h-9 sm:w-10 sm:h-10 border border-[#B89358] flex items-center justify-center relative bg-[#1E1B18] shadow-sm transition-transform duration-300 group-hover:scale-105"
      >
        <span class="text-[#B89358] font-serif text-lg sm:text-xl font-bold tracking-wider">R</span>
        <span class="absolute -top-0.5 -left-0.5 w-1 h-1 bg-[#B89358]"></span>
        <span class="absolute -bottom-0.5 -right-0.5 w-1 h-1 bg-[#B89358]"></span>
      </div>
      <div class="flex flex-col">
        <span
          class="font-serif text-xl sm:text-2xl font-bold tracking-[0.2em] transition-colors duration-300"
          [ngClass]="isScrolled() ? 'text-[#1D1C1A] dark:text-[#FAF7F2]' : 'text-white'"
        >
          RAMYUG
        </span>
        <span
          class="text-[0.58rem] sm:text-[0.62rem] tracking-[0.28em] uppercase text-[#B89358] font-medium leading-none mt-0.5"
        >
          Architectural Legacy
        </span>
      </div>
    </a>

    <!-- Desktop Horizontal Navigation Links (Fluid Typography & Spacing) -->
    <nav class="hidden lg:flex items-center gap-4 xl:gap-7 2xl:gap-9">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="text-[#B89358] font-semibold after:scale-x-100"
        [routerLinkActiveOptions]="{ exact: !!item.exact }"
        class="whitespace-nowrap text-[0.72rem] xl:text-xs 2xl:text-sm uppercase tracking-[0.12em] xl:tracking-[0.16em] transition-colors duration-200 hover:text-[#B89358] relative py-1.5 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-full after:h-[1.5px] after:bg-[#B89358] after:scale-x-0 after:origin-left after:transition-transform after:duration-200"
        [ngClass]="isScrolled() ? 'text-[#1D1C1A] dark:text-[#FAF7F2]/90' : 'text-white/90'"
      >
        {{ item.label }}
      </a>
    </nav>

    <!-- Desktop Right Controls: Theme Toggle & VIP Action Button -->
    <div class="hidden lg:flex items-center gap-3 xl:gap-4 shrink-0">
      <!-- Luxury Dark/Light Theme Toggle Button -->
      <button
        (click)="toggleTheme()"
        type="button"
        class="w-9 h-9 border border-[#E5DFD5] dark:border-[#2F2B26] bg-[#FAF7F2] dark:bg-[#1E1B18] text-[#B89358] hover:border-[#B89358] flex items-center justify-center transition-all duration-200 focus:outline-none cursor-pointer shadow-sm"
        [title]="themeService.isDarkMode() ? 'Switch to Warm Cream Light' : 'Switch to Velvet Dark'"
        aria-label="Toggle Theme Mode"
      >
        <!-- Sun Icon (Active when in Dark Mode) -->
        <svg
          *ngIf="themeService.isDarkMode()"
          class="w-4 h-4 fill-current stroke-current"
          viewBox="0 0 24 24"
        >
          <circle cx="12" cy="12" r="5" fill="currentColor" />
          <path
            stroke-width="2"
            stroke-linecap="round"
            d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
          />
        </svg>

        <!-- Moon Icon (Active when in Light Mode) -->
        <svg *ngIf="!themeService.isDarkMode()" class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
        </svg>
      </button>

      <!-- VIP Action Button -->
      <!-- <a 
        routerLink="/contact" 
        class="inline-flex items-center justify-center px-4 xl:px-6 py-2 xl:py-2.5 text-[0.7rem] xl:text-xs font-semibold uppercase tracking-[0.16em] xl:tracking-[0.2em] bg-[#B89358] hover:bg-[#A88248] text-white transition-colors duration-200 shadow-sm whitespace-nowrap cursor-pointer"
      >
        Book Consultation
      </a> -->
    </div>

    <!-- Mobile & Tablet Header Controls (< lg) -->
    <div class="lg:hidden flex items-center gap-2 sm:gap-3">
      <!-- Mobile Theme Toggle -->
      <button
        (click)="toggleTheme()"
        type="button"
        class="w-10 h-10 border border-[#B89358]/60 text-[#B89358] bg-[#1E1B18]/80 flex items-center justify-center focus:outline-none cursor-pointer rounded-sm"
        [attr.aria-label]="
          themeService.isDarkMode() ? 'Switch to Light Theme' : 'Switch to Dark Theme'
        "
      >
        <svg
          *ngIf="themeService.isDarkMode()"
          class="w-4 h-4 fill-current stroke-current"
          viewBox="0 0 24 24"
        >
          <circle cx="12" cy="12" r="5" fill="currentColor" />
          <path
            stroke-width="2"
            stroke-linecap="round"
            d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
          />
        </svg>
        <svg *ngIf="!themeService.isDarkMode()" class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
        </svg>
      </button>

      <!-- Animated Touch-Friendly Hamburger Button -->
      <button
        (click)="toggleMobileMenu()"
        type="button"
        class="w-10 h-10 border border-[#E5DFD5] dark:border-[#2F2B26] bg-[#FAF7F2] dark:bg-[#1E1B18] flex items-center justify-center focus:outline-none cursor-pointer rounded-sm shadow-sm"
        [attr.aria-expanded]="mobileMenuOpen()"
        [attr.aria-label]="
          mobileMenuOpen() ? 'Close Mobile Navigation Menu' : 'Open Mobile Navigation Menu'
        "
      >
        <div class="w-5 h-4 flex flex-col justify-between relative">
          <span
            class="w-full h-0.5 transition-all duration-300 ease-in-out"
            [ngClass]="
              mobileMenuOpen()
                ? 'rotate-45 translate-y-1.5 bg-[#B89358]'
                : 'bg-[#1D1C1A] dark:bg-[#FAF7F2]'
            "
          ></span>
          <span
            class="w-full h-0.5 transition-all duration-300 ease-in-out"
            [ngClass]="mobileMenuOpen() ? 'opacity-0 scale-x-0' : 'bg-[#1D1C1A] dark:bg-[#FAF7F2]'"
          ></span>
          <span
            class="w-full h-0.5 transition-all duration-300 ease-in-out"
            [ngClass]="
              mobileMenuOpen()
                ? '-rotate-45 -translate-y-2 bg-[#B89358]'
                : 'bg-[#1D1C1A] dark:bg-[#FAF7F2]'
            "
          ></span>
        </div>
      </button>
    </div>
  </div>
</header>

<!-- MOBILE & TABLET DRAWER OVERLAY BACKDROP (< lg) -->
<div
  *ngIf="mobileMenuOpen()"
  (click)="closeMobileMenu()"
  class="lg:hidden fixed inset-0 bg-[#141311]/70 dark:bg-black/80 backdrop-blur-sm z-50 transition-opacity duration-300 animate-in fade-in"
  aria-hidden="true"
></div>

<!-- COLLAPSIBLE MOBILE SLIDE-OUT DRAWER (< lg) -->
<aside
  class="lg:hidden fixed top-0 right-0 bottom-0 w-[88vw] max-w-sm sm:max-w-md bg-[#FAF7F2] dark:bg-[#141311] border-l border-[#E5DFD5] dark:border-[#2F2B26] text-[#1D1C1A] dark:text-[#FAF7F2] z-50 flex flex-col justify-between p-6 sm:p-8 shadow-2xl transition-transform duration-300 ease-out overflow-y-auto"
  [ngClass]="mobileMenuOpen() ? 'translate-x-0' : 'translate-x-full pointer-events-none'"
  aria-label="Mobile Navigation"
>
  <!-- Drawer Header: Brand + Close Icon -->
  <div
    class="flex items-center justify-between border-b border-[#E5DFD5] dark:border-[#2F2B26] pb-5"
  >
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 border border-[#B89358] flex items-center justify-center bg-[#1E1B18]">
        <span class="text-[#B89358] font-serif text-base font-bold">R</span>
      </div>
      <div>
        <span class="font-serif text-lg font-bold tracking-[0.2em] block leading-tight"
          >RAMYUG</span
        >
        <span class="text-[0.55rem] uppercase tracking-[0.25em] text-[#B89358] font-medium block"
          >Menu Guild</span
        >
      </div>
    </div>

    <button
      (click)="closeMobileMenu()"
      type="button"
      class="w-9 h-9 border border-[#E5DFD5] dark:border-[#2F2B26] bg-[#F4EFE6] dark:bg-[#1E1B18] text-[#1D1C1A] dark:text-[#FAF7F2] hover:text-[#B89358] flex items-center justify-center focus:outline-none cursor-pointer transition-colors"
      aria-label="Close navigation drawer"
    >
      <svg class="w-4 h-4 stroke-current fill-none stroke-2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Drawer Navigation Links (Touch-Friendly Tap Targets & Fluid Typography) -->
  <div class="flex flex-col gap-2 py-6">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.path"
      (click)="closeMobileMenu()"
      routerLinkActive="bg-[#F4EFE6] dark:bg-[#1E1B18] text-[#B89358] font-semibold border-l-2 border-[#B89358] pl-4"
      [routerLinkActiveOptions]="{ exact: !!item.exact }"
      class="py-3 px-3 min-h-[48px] text-[#1D1C1A] dark:text-[#FAF7F2] hover:text-[#B89358] hover:bg-[#F4EFE6]/60 dark:hover:bg-[#1E1B18]/60 transition-all flex items-center justify-between group focus:outline-none"
    >
      <span class="font-serif text-lg sm:text-xl font-medium tracking-tight">
        {{ item.label }}
      </span>
      <span
        class="text-[0.65rem] font-sans tracking-[0.2em] uppercase text-[#B89358] font-semibold bg-[#FAF7F2] dark:bg-[#141311] px-2 py-0.5 border border-[#E5DFD5] dark:border-[#2F2B26]"
      >
        {{ item.badge }}
      </span>
    </a>
  </div>

  <!-- Drawer Footer: Theme Controls, Concierge CTA, and Info -->
  <div class="flex flex-col gap-4 pt-6 border-t border-[#E5DFD5] dark:border-[#2F2B26]">
    <!-- Theme Switcher Card -->
    <div
      class="flex items-center justify-between p-3.5 bg-[#F4EFE6] dark:bg-[#1E1B18] border border-[#E5DFD5] dark:border-[#2F2B26]"
    >
      <div class="space-y-0.5">
        <span
          class="text-[0.65rem] uppercase tracking-widest text-[#6E6962] dark:text-[#C8C0B5] font-light block"
        >
          Current Theme
        </span>
        <strong class="text-xs text-[#1D1C1A] dark:text-[#FAF7F2] font-semibold">
          {{ themeService.isDarkMode() ? 'Velvet Dark' : 'Warm Cream Light' }}
        </strong>
      </div>
      <button
        (click)="toggleTheme()"
        type="button"
        class="px-3.5 py-1.5 bg-[#B89358] hover:bg-[#A88248] text-white text-xs uppercase font-semibold tracking-wider cursor-pointer transition-colors shadow-sm"
      >
        Switch
      </button>
    </div>

    <!-- Primary CTA -->
    <a
      routerLink="/contact"
      (click)="closeMobileMenu()"
      class="w-full text-center py-3.5 bg-[#1D1C1A] dark:bg-[#B89358] hover:bg-[#B89358] dark:hover:bg-[#A88248] text-white dark:text-[#1D1C1A] hover:text-white text-xs font-semibold uppercase tracking-[0.2em] transition-colors shadow-sm cursor-pointer"
    >
      Book Private Consultation
    </a>

    <!-- Concierge Details -->
    <div class="text-center space-y-1 pt-1">
      <p class="text-[0.7rem] text-[#6E6962] dark:text-[#C8C0B5] font-light m-0">
        Direct Line: <strong class="text-[#B89358] font-medium">+91 (0) 22 8899 7700</strong>
      </p>
      <p
        class="text-[0.65rem] text-[#6E6962]/80 dark:text-[#C8C0B5]/80 uppercase tracking-widest m-0"
      >
        RAMYUG Atelier &bull; Global Headquarters
      </p>
    </div>
  </div>
</aside>
