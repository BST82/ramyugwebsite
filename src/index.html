<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RAMYUG | Luxury Architectural Legacy</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ramyug is a premier luxury architectural and engineering firm sculpting iconic residential estates, commercial towers, and heritage monuments." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    
    <!-- Google Fonts Integration: Old Standard TT (Editorial Serif Headings) & Plus Jakarta Sans / Montserrat (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Immediate Light Mode Default Guarantee Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ramyug-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#FAF7F2] dark:bg-[#141311] text-[#1D1C1A] dark:text-[#FAF7F2] font-sans antialiased selection:bg-[#B89358] selection:text-white min-h-screen flex flex-col transition-colors duration-300">
    
    <!-- Application Root with Embedded Luxury Pre-loader -->
    <app-root>
      <div class="ramyug-preloader">
        <div class="ramyug-preloader-content">
          <div class="ramyug-logo-box">
            <span class="ramyug-monogram">R</span>
            <div class="ramyug-ring"></div>
          </div>
          <div class="ramyug-brand-text">RAMYUG</div>
          <div class="ramyug-sub-text">ARCHITECTURAL LEGACY</div>
          <div class="ramyug-progress-bar">
            <div class="ramyug-progress-fill"></div>
          </div>
        </div>
      </div>
    </app-root>

  </body>
</html>
